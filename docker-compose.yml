version: '3.8'

services:
  lucy-agent:
    build: .
    container_name: lucy_agent
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./memory:/app/memory
      - ./keys:/app/keys
      - ./knowledge:/app/knowledge
      - ./uploads:/app/uploads
      - ./workspace:/app/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
